<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="chatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#080F1E" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="chatHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- AI Card Gradient -->
    <linearGradient id="aiCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D192E" />
      <stop offset="100%" stop-color="#07101E" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulseThinking {
        0%, 100% { opacity: 0.4; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.05); filter: drop-shadow(0 0 6px #38BDF8); }
      }
      @keyframes fadeSlideIn {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulseActiveNode {
        0%, 100% { stroke: #38BDF8; stroke-width: 1.5; }
        50% { stroke: #22D3EE; stroke-width: 2.5; filter: drop-shadow(0 0 8px #22D3EE); }
      }

      .cursor-blink { animation: blinkCursor 0.8s infinite; }
      .thinking-dot1 { animation: pulseThinking 1.4s ease-in-out infinite 0s; }
      .thinking-dot2 { animation: pulseThinking 1.4s ease-in-out infinite 0.25s; }
      .thinking-dot3 { animation: pulseThinking 1.4s ease-in-out infinite 0.5s; }
      .node-pulse-border { animation: pulseActiveNode 2s infinite; }
    </style>
  </defs>

  <!-- Main Container -->
  <rect width="1000" height="480" rx="14" fill="url(#chatBg)" stroke="#1E293B" stroke-width="1.8" />

  <!-- Header Bar -->
  <path d="M 0 14 Q 0 0 14 0 L 986 0 Q 1000 0 1000 14 L 1000 42 L 0 42 Z" fill="url(#chatHeader)" />
  <line x1="0" y1="42" x2="1000" y2="42" stroke="#334155" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="22" cy="21" r="5.5" fill="#EF4444" />
  <circle cx="38" cy="21" r="5.5" fill="#F59E0B" />
  <circle cx="54" cy="21" r="5.5" fill="#10B981" />

  <!-- Window Title -->
  <text x="82" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94A3B8">
    NEXUS://AI_ASSISTANT/COGNITIVE_REASONER [AIR-GAPPED LLM MODE]
  </text>

  <!-- Right Header Model Pill -->
  <g transform="translate(970, 21)">
    <rect x="-170" y="-11" width="160" height="22" rx="11" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1" />
    <circle cx="-154" cy="0" r="3.5" fill="#10B981" />
    <text x="-142" y="4" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#38BDF8">
      qwen2.5:7b • ZERO LEAK
    </text>
  </g>

  <!-- ================= CHAT CONVERSATION STREAM ================= -->

  <!-- 1. Investigator Query Bubble -->
  <g transform="translate(320, 64)">
    <rect width="640" height="52" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <!-- User Icon -->
    <rect x="14" y="12" width="28" height="28" rx="14" fill="#0284C7" />
    <text x="28" y="30" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">IN</text>
    
    <text x="56" y="24" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#94A3B8">
      INVESTIGATOR &#8226; BADGE #4092 &#8226; 22:58:14
    </text>
    <text x="56" y="42" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#F8FAFC">
      Trace money trail from Aarav Malhotra to Apex Meridian Trading and highlight conduits.
    </text>
  </g>

  <!-- 2. AI Reasoning Status -->
  <g transform="translate(40, 132)">
    <circle cx="8" cy="8" r="4" fill="#38BDF8" class="thinking-dot1" />
    <circle cx="22" cy="8" r="4" fill="#818CF8" class="thinking-dot2" />
    <circle cx="36" cy="8" r="4" fill="#C084FC" class="thinking-dot3" />
    <text x="52" y="12" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">
      Resolving multi-hop path through 112 case edges... 3 transaction hops located. Corroborating with ChromaDB evidence vectors.
    </text>
  </g>

  <!-- 3. AI Grounded Response Bubble -->
  <g transform="translate(40, 158)">
    <rect width="920" height="236" rx="12" fill="url(#aiCardGrad)" stroke="#0284C7" stroke-width="1.2" class="node-pulse-border" />
    
    <!-- Header with AI Badge -->
    <g transform="translate(18, 16)">
      <rect width="28" height="28" rx="6" fill="#0284C7" />
      <text x="14" y="19" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">NX</text>
      
      <text x="38" y="12" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#38BDF8">
        NEXUS COGNITIVE REASONER
      </text>
      <text x="38" y="24" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748B">
        STRICT GROUNDING: ACTIVE CASE DOSSIER &#8226; AUDIT REF: #EV-7729
      </text>
      
      <!-- Right Badge: High Confidence -->
      <rect x="730" y="2" width="130" height="22" rx="11" fill="#064E3B" stroke="#059669" stroke-width="1" />
      <text x="795" y="16" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#34D399" text-anchor="middle">
        CONFIDENCE: 98.4%
      </text>
    </g>

    <line x1="18" y1="56" x2="902" y2="56" stroke="#1E293B" stroke-width="1" />

    <!-- Visual Conduit Flow in Chat -->
    <g transform="translate(18, 72)">
      <text x="0" y="14" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#CBD5E1">
        IDENTIFIED MONEY CONDUIT PATHWAY (3 HOPS):
      </text>

      <!-- Step 1: Aarav -->
      <rect x="0" y="26" width="170" height="34" rx="6" fill="#0B1528" stroke="#0284C7" stroke-width="1" />
      <text x="10" y="42" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Aarav Malhotra</text>
      <text x="10" y="54" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38BDF8">ORIGINATING SUSPECT</text>

      <!-- Arrow 1 -->
      <text x="184" y="48" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">&#8594;</text>

      <!-- Step 2: Account -->
      <rect x="206" y="26" width="160" height="34" rx="6" fill="#121330" stroke="#6366F1" stroke-width="1" />
      <text x="216" y="42" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">ACC-78421</text>
      <text x="216" y="54" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#A5B4FC">PRIMARY MULE ACCT</text>

      <!-- Arrow 2 -->
      <text x="380" y="48" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">&#8594;</text>

      <!-- Step 3: Hawala Node -->
      <rect x="402" y="26" width="190" height="34" rx="6" fill="#241433" stroke="#A855F7" stroke-width="1" />
      <text x="412" y="42" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Hawala Hub ACC-55218</text>
      <text x="412" y="54" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#D8B4FE">WIRE: $450,000 CONDUIT</text>

      <!-- Arrow 3 -->
      <text x="606" y="48" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">&#8594;</text>

      <!-- Step 4: Apex Meridian -->
      <rect x="628" y="26" width="180" height="34" rx="6" fill="#2B1607" stroke="#F59E0B" stroke-width="1" />
      <text x="638" y="42" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FDE68A">Apex Meridian Trading</text>
      <text x="638" y="54" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#FBBF24">BENEFICIARY ENTITY</text>
    </g>

    <!-- Corroborating Evidence Footnotes -->
    <g transform="translate(18, 150)">
      <rect width="884" height="66" rx="6" fill="#040914" stroke="#1E293B" stroke-width="0.8" />
      <text x="14" y="20" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#94A3B8">
        CORROBORATING EVIDENCE &amp; AUDIT LOG:
      </text>
      <text x="14" y="38" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#E2E8F0">
        • <tspan fill="#38BDF8">Doc #04 (Financial Ledger.pdf):</tspan> Confirms $450,000 outflow matching transaction code #TX-9904 on 2026-02-14.
      </text>
      <text x="14" y="54" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#E2E8F0">
        • <tspan fill="#10B981">Automated System Action:</tspan> Highlighted node <tspan fill="#F59E0B">ACC-55218</tspan> and selected path in the 3D Topology view.
      </text>
    </g>
  </g>

  <!-- 4. Interactive Bottom Input Bar Mockup -->
  <g transform="translate(40, 412)">
    <rect width="920" height="46" rx="8" fill="#0B1324" stroke="#334155" stroke-width="1" />
    <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#F8FAFC">
      Who authorized the beneficial ownership transfer for Apex Meridian Trading?
    </text>
    <rect x="655" y="15" width="2" height="18" fill="#38BDF8" class="cursor-blink" />
    
    <!-- Send Button -->
    <rect x="840" y="7" width="68" height="32" rx="6" fill="#0284C7" />
    <text x="874" y="27" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      QUERY &#8594;
    </text>
  </g>
</svg>
