<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for Text & Accents -->
    <linearGradient id="nexusTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="lineGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="lineGradPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters for Bloom & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.18); opacity: 1; filter: drop-shadow(0 0 14px #38BDF8); }
      }
      @keyframes pulseAlert {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 16px #EF4444); }
      }
      @keyframes textShimmer {
        0% { stop-color: #38BDF8; }
        50% { stop-color: #F472B6; }
        100% { stop-color: #38BDF8; }
      }
      @keyframes scanline {
        0% { transform: translateY(-440px); }
        100% { transform: translateY(440px); }
      }
      @keyframes beaconRing {
        0% { r: 12px; opacity: 1; }
        100% { r: 42px; opacity: 0; stroke-width: 1px; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }

      .radar-sweep {
        transform-origin: 600px 220px;
        animation: radarSweep 12s linear infinite;
      }
      .dash-pulse-1 {
        stroke-dasharray: 8, 12;
        animation: dashMove 3s linear infinite;
      }
      .dash-pulse-2 {
        stroke-dasharray: 6, 10;
        animation: dashMove 4s linear infinite reverse;
      }
      .dash-pulse-fast {
        stroke-dasharray: 12, 16;
        animation: dashMove 2s linear infinite;
      }
      .node-pulse-cyan {
        transform-origin: center;
        animation: pulseNode 3.5s ease-in-out infinite;
      }
      .node-pulse-red {
        transform-origin: center;
        animation: pulseAlert 2.2s ease-in-out infinite;
      }
      .ring-anim {
        animation: beaconRing 2.8s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }
      .float-group {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .cursor-blink {
        animation: blinkCursor 1s infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="440" fill="url(#bgGradient)" rx="16" />

  <!-- Cyber Grid -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="340" x2="1200" y2="340" />
    <line x1="0" y1="400" x2="1200" y2="400" />

    <line x1="80" y1="0" x2="80" y2="440" />
    <line x1="200" y1="0" x2="200" y2="440" />
    <line x1="320" y1="0" x2="320" y2="440" />
    <line x1="440" y1="0" x2="440" y2="440" />
    <line x1="560" y1="0" x2="560" y2="440" />
    <line x1="680" y1="0" x2="680" y2="440" />
    <line x1="800" y1="0" x2="800" y2="440" />
    <line x1="920" y1="0" x2="920" y2="440" />
    <line x1="1040" y1="0" x2="1040" y2="440" />
    <line x1="1120" y1="0" x2="1120" y2="440" />
  </g>

  <!-- Central Ambient Radial Glow -->
  <circle cx="600" cy="210" r="380" fill="url(#cyberGlow)" />

  <!-- Radar Cones & Circles -->
  <g opacity="0.22">
    <circle cx="600" cy="220" r="80" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4, 4" />
    <circle cx="600" cy="220" r="160" fill="none" stroke="#6366F1" stroke-width="1" />
    <circle cx="600" cy="220" r="240" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2, 6" />
    <circle cx="600" cy="220" r="320" fill="none" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Rotating Radar Sweep Line -->
  <g class="radar-sweep" opacity="0.35">
    <path d="M 600 220 L 880 220 A 280 280 0 0 0 740 60 Z" fill="url(#radarGlow)" />
    <line x1="600" y1="220" x2="880" y2="220" stroke="#22D3EE" stroke-width="2" filter="url(#glow)" />
  </g>

  <!-- ================= NETWORK GRAPH EDGES ================= -->
  <!-- Left Cluster Edges -->
  <g stroke-width="1.8" opacity="0.65">
    <line x1="140" y1="120" x2="260" y2="180" stroke="#38BDF8" />
    <line x1="140" y1="120" x2="180" y2="280" stroke="#6366F1" />
    <line x1="260" y1="180" x2="360" y2="130" stroke="#06B6D4" />
    <line x1="180" y1="280" x2="290" y2="310" stroke="#8B5CF6" />
    <line x1="260" y1="180" x2="290" y2="310" stroke="#38BDF8" />
    <line x1="360" y1="130" x2="450" y2="220" stroke="#38BDF8" />
    <line x1="290" y1="310" x2="450" y2="220" stroke="#6366F1" />
  </g>

  <!-- Animated Pulse Beams on Left -->
  <g stroke-width="2.5" opacity="0.9">
    <line x1="140" y1="120" x2="260" y2="180" stroke="#38BDF8" class="dash-pulse-1" filter="url(#glow)" />
    <line x1="260" y1="180" x2="360" y2="130" stroke="#22D3EE" class="dash-pulse-fast" filter="url(#glow)" />
    <line x1="290" y1="310" x2="450" y2="220" stroke="#A855F7" class="dash-pulse-2" filter="url(#glow)" />
  </g>

  <!-- Right Cluster Edges (High Risk / Red / Gold) -->
  <g stroke-width="1.8" opacity="0.65">
    <line x1="1060" y1="130" x2="940" y2="190" stroke="#F43F5E" />
    <line x1="1060" y1="130" x2="1020" y2="300" stroke="#EF4444" />
    <line x1="940" y1="190" x2="840" y2="140" stroke="#F59E0B" />
    <line x1="1020" y1="300" x2="910" y2="320" stroke="#EC4899" />
    <line x1="940" y1="190" x2="910" y2="320" stroke="#F43F5E" />
    <line x1="840" y1="140" x2="750" y2="230" stroke="#F59E0B" />
    <line x1="910" y1="320" x2="750" y2="230" stroke="#EF4444" />
  </g>

  <!-- Animated Pulse Beams on Right -->
  <g stroke-width="2.5" opacity="0.9">
    <line x1="1060" y1="130" x2="940" y2="190" stroke="#F43F5E" class="dash-pulse-1" filter="url(#glow)" />
    <line x1="940" y1="190" x2="840" y2="140" stroke="#FBBF24" class="dash-pulse-fast" filter="url(#glow)" />
    <line x1="910" y1="320" x2="750" y2="230" stroke="#FB7185" class="dash-pulse-2" filter="url(#glow)" />
  </g>

  <!-- Bridges to Core Intelligence Hub -->
  <line x1="450" y1="220" x2="520" y2="220" stroke="#38BDF8" stroke-width="2" class="dash-pulse-fast" filter="url(#glow)" />
  <line x1="750" y1="230" x2="680" y2="220" stroke="#F43F5E" stroke-width="2" class="dash-pulse-fast" filter="url(#glow)" />

  <!-- ================= NETWORK GRAPH NODES ================= -->
  <!-- Left Nodes (Entities / Accounts) -->
  <g class="float-group">
    <!-- Node 1: Person (Aarav Malhotra) -->
    <g transform="translate(140, 120)">
      <circle r="14" fill="#0B192C" stroke="#38BDF8" stroke-width="2.5" filter="url(#glow)" />
      <circle r="5" fill="#38BDF8" />
      <text x="0" y="28" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">AARAV (SUSPECT)</text>
    </g>

    <!-- Node 2: Account -->
    <g transform="translate(260, 180)">
      <circle r="16" fill="#091E3A" stroke="#06B6D4" stroke-width="2.5" filter="url(#glow)" />
      <circle r="6" fill="#22D3EE" />
      <circle class="ring-anim" cx="0" cy="0" r="16" fill="none" stroke="#22D3EE" stroke-width="2" />
      <text x="0" y="30" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ACC-78421</text>
    </g>

    <!-- Node 3: Organization -->
    <g transform="translate(180, 280)">
      <circle r="13" fill="#0E172A" stroke="#818CF8" stroke-width="2" />
      <circle r="4" fill="#818CF8" />
      <text x="0" y="26" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">SHELL CORP</text>
    </g>

    <!-- Node 4: Telecom Device -->
    <g transform="translate(360, 130)">
      <circle r="12" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
      <circle r="4" fill="#38BDF8" />
      <text x="0" y="24" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">+91-98112-X</text>
    </g>

    <!-- Node 5: Location Intercept -->
    <g transform="translate(290, 310)">
      <circle r="13" fill="#0B1329" stroke="#A855F7" stroke-width="2" />
      <circle r="4" fill="#C084FC" />
      <text x="0" y="26" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">MUMBAI PORT</text>
    </g>

    <!-- Connector Gateway Node Left -->
    <g transform="translate(450, 220)">
      <circle r="17" fill="#0F2847" stroke="#38BDF8" stroke-width="3" filter="url(#glow)" />
      <circle r="7" fill="#38BDF8" />
      <circle class="ring-anim" cx="0" cy="0" r="17" fill="none" stroke="#38BDF8" stroke-width="2" />
      <text x="0" y="32" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SUBGRAPH α</text>
    </g>
  </g>

  <!-- Right Nodes (High Risk / Flags / Anomaly) -->
  <g class="float-group">
    <!-- Node 6: Apex Meridian Org -->
    <g transform="translate(1060, 130)">
      <circle r="15" fill="#2A0B1A" stroke="#F43F5E" stroke-width="2.5" filter="url(#glow)" />
      <circle r="5" fill="#FB7185" />
      <text x="0" y="28" fill="#FDA4AF" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">APEX MERIDIAN</text>
    </g>

    <!-- Node 7: Critical Suspect -->
    <g transform="translate(940, 190)">
      <circle r="18" fill="#3B0C1E" stroke="#EF4444" stroke-width="3" filter="url(#intenseGlow)" />
      <circle r="7" fill="#EF4444" />
      <circle class="ring-anim" cx="0" cy="0" r="18" fill="none" stroke="#EF4444" stroke-width="2" />
      <text x="0" y="34" fill="#FCA5A5" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">VIKRAM [0.94 RISK]</text>
    </g>

    <!-- Node 8: Crypto Wallet -->
    <g transform="translate(840, 140)">
      <circle r="13" fill="#241B08" stroke="#F59E0B" stroke-width="2" />
      <circle r="4" fill="#FBBF24" />
      <text x="0" y="26" fill="#FDE68A" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">0x882a...b4</text>
    </g>

    <!-- Node 9: Hawala Broker -->
    <g transform="translate(1020, 300)">
      <circle r="13" fill="#290E1F" stroke="#EC4899" stroke-width="2" />
      <circle r="4" fill="#F472B6" />
      <text x="0" y="26" fill="#FBCFE8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">OFFSHORE LLC</text>
    </g>

    <!-- Node 10: Drop Location -->
    <g transform="translate(910, 320)">
      <circle r="12" fill="#220D1A" stroke="#FB7185" stroke-width="2" />
      <circle r="4" fill="#F43F5E" />
      <text x="0" y="24" fill="#FDA4AF" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">DUBAI SECTOR 4</text>
    </g>

    <!-- Connector Gateway Node Right -->
    <g transform="translate(750, 230)">
      <circle r="17" fill="#3D1226" stroke="#EF4444" stroke-width="3" filter="url(#intenseGlow)" />
      <circle r="7" fill="#EF4444" />
      <circle class="ring-anim" cx="0" cy="0" r="17" fill="none" stroke="#EF4444" stroke-width="2" />
      <text x="0" y="32" fill="#EF4444" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SUBGRAPH β</text>
    </g>
  </g>

  <!-- ================= CENTER BRANDING & HUD ================= -->
  <!-- Top Badge: Ministry & Hackathon -->
  <g transform="translate(600, 52)">
    <rect x="-190" y="-16" width="380" height="30" rx="15" fill="#0B132B" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="-165" cy="-1" r="5" fill="#10B981" />
    <text x="-150" y="3" fill="#94A3B8" font-family="'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">SMART INDIA HACKATHON 2026</text>
    <text x="110" y="3" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">SIH26189</text>
  </g>

  <!-- Core NEXUS Title with Glow -->
  <g transform="translate(600, 150)">
    <text x="0" y="0" 
          font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="18" 
          text-anchor="middle" 
          fill="none" 
          stroke="#38BDF8" 
          stroke-width="12" 
          opacity="0.25" 
          filter="url(#intenseGlow)">NEXUS</text>
    <text x="0" y="0" 
          font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="18" 
          text-anchor="middle" 
          fill="url(#nexusTextGrad)" 
          filter="url(#glow)">NEXUS</text>
  </g>

  <!-- Platform Description / Subtitle -->
  <g transform="translate(600, 200)">
    <text x="0" y="0" 
          font-family="'Segoe UI', Roboto, sans-serif" 
          font-size="16" 
          font-weight="700" 
          letter-spacing="4" 
          text-anchor="middle" 
          fill="#E2E8F0">AI-POWERED CRIMINAL NETWORK ANALYSIS SYSTEM</text>
  </g>

  <!-- Tagline / Division -->
  <g transform="translate(600, 230)">
    <text x="0" y="0" 
          font-family="'Segoe UI', Roboto, 'JetBrains Mono', monospace" 
          font-size="12" 
          font-weight="600" 
          letter-spacing="2" 
          text-anchor="middle" 
          fill="#64748B">NCRB WOMEN SAFETY DIVISION • MINISTRY OF HOME AFFAIRS</text>
  </g>

  <!-- Real-time HUD Capabilities Pills -->
  <g transform="translate(600, 290)">
    <!-- Pill 1: 3D Topology -->
    <g transform="translate(-235, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0B1A30" stroke="#0284C7" stroke-width="1.2" />
      <text x="0" y="4" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">⬡ 3D GRAPH AI</text>
    </g>

    <!-- Pill 2: RAG Vector Engine -->
    <g transform="translate(-80, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#151238" stroke="#6366F1" stroke-width="1.2" />
      <text x="0" y="4" fill="#A5B4FC" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">⚡ RAG ASSISTANT</text>
    </g>

    <!-- Pill 3: Geospatial Tracking -->
    <g transform="translate(80, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#092525" stroke="#0D9488" stroke-width="1.2" />
      <text x="0" y="4" fill="#5EEAD4" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">◉ GIS TIMELINE</text>
    </g>

    <!-- Pill 4: Zero-Knowledge Isolation -->
    <g transform="translate(235, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#260C1D" stroke="#E11D48" stroke-width="1.2" />
      <text x="0" y="4" fill="#FDA4AF" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">🔒 CASE ISOLATION</text>
    </g>
  </g>

  <!-- Bottom System Status Bar -->
  <g transform="translate(0, 395)">
    <!-- Line separator -->
    <line x1="20" y1="0" x2="1180" y2="0" stroke="#1E293B" stroke-width="1.2" />

    <!-- Left telemetry -->
    <g transform="translate(40, 24)">
      <circle cx="0" cy="-3" r="4.5" fill="#10B981" />
      <text x="14" y="0" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">SYSTEM: ONLINE</text>
      <text x="135" y="0" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">|</text>
      <text x="155" y="0" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">FASTAPI : 8000</text>
      <text x="260" y="0" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11">|</text>
      <text x="280" y="0" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">NEXT.JS 15 : 3000</text>
    </g>

    <!-- Center build info -->
    <g transform="translate(600, 24)">
      <text x="0" y="0" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="500" text-anchor="middle">QUANTUM CODERS • PRODUCTION READY v2.4 • HACKATHON EDITION</text>
    </g>

    <!-- Right telemetry -->
    <g transform="translate(1160, 24)">
      <text x="0" y="0" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="end">OLLAMA / LLM GROUNDED</text>
      <circle cx="12" cy="-3" r="3.5" fill="#38BDF8" class="cursor-blink" />
    </g>
  </g>

  <!-- Futuristic Corner Brackets -->
  <!-- Top Left -->
  <path d="M 12 36 L 12 12 L 36 12" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.8" />
  <!-- Top Right -->
  <path d="M 1164 12 L 1188 12 L 1188 36" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.8" />
  <!-- Bottom Left -->
  <path d="M 12 404 L 12 428 L 36 428" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.8" />
  <!-- Bottom Right -->
  <path d="M 1164 428 L 1188 428 L 1188 404" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.8" />
</svg>
