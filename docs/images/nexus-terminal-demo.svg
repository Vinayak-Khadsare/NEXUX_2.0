<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <style>
      @keyframes blinkTerm {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes stepAppear1 { 0%, 10% { opacity: 0; } 15%, 100% { opacity: 1; } }
      @keyframes stepAppear2 { 0%, 25% { opacity: 0; } 30%, 100% { opacity: 1; } }
      @keyframes stepAppear3 { 0%, 40% { opacity: 0; } 45%, 100% { opacity: 1; } }
      @keyframes stepAppear4 { 0%, 55% { opacity: 0; } 60%, 100% { opacity: 1; } }
      @keyframes stepAppear5 { 0%, 70% { opacity: 0; } 75%, 100% { opacity: 1; } }
      @keyframes stepAppear6 { 0%, 85% { opacity: 0; } 90%, 100% { opacity: 1; } }

      .term-cursor { animation: blinkTerm 0.8s infinite; }
      .log-line-1 { animation: stepAppear1 10s infinite; }
      .log-line-2 { animation: stepAppear2 10s infinite; }
      .log-line-3 { animation: stepAppear3 10s infinite; }
      .log-line-4 { animation: stepAppear4 10s infinite; }
      .log-line-5 { animation: stepAppear5 10s infinite; }
      .log-line-6 { animation: stepAppear6 10s infinite; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1000" height="380" rx="12" fill="url(#termBg)" stroke="#1E293B" stroke-width="1.6" />

  <!-- Header -->
  <path d="M 0 12 Q 0 0 12 0 L 988 0 Q 1000 0 1000 12 L 1000 38 L 0 38 Z" fill="url(#termHeader)" />
  <line x1="0" y1="38" x2="1000" y2="38" stroke="#334155" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="20" cy="19" r="5" fill="#EF4444" />
  <circle cx="36" cy="19" r="5" fill="#F59E0B" />
  <circle cx="52" cy="19" r="5" fill="#10B981" />

  <!-- Terminal Title -->
  <text x="500" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">
    powershell &#8212; Start-NEXUS.bat (Zero-Terminal Orchestrator)
  </text>

  <!-- Terminal Content Stream -->
  <g transform="translate(30, 70)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12">
    <!-- Command Prompt Line -->
    <text x="0" y="0" fill="#38BDF8" font-weight="700">user@workstation:~/nexus$</text>
    <text x="215" y="0" fill="#F8FAFC" font-weight="600">.\Start-NEXUS.bat</text>

    <!-- Banner ASCII -->
    <g class="log-line-1" transform="translate(0, 26)">
      <text x="0" y="0" fill="#0284C7" font-weight="800">================================================================================</text>
      <text x="0" y="18" fill="#38BDF8" font-weight="800">[NEXUS] AI-POWERED CRIMINAL NETWORK ANALYSIS PLATFORM &#8226; SIH26189</text>
      <text x="0" y="36" fill="#0284C7" font-weight="800">================================================================================</text>
    </g>

    <!-- Service Checks -->
    <g class="log-line-2" transform="translate(0, 88)">
      <text x="0" y="0" fill="#10B981" font-weight="700">[✓] [1/5] MongoDB 7.0 Service</text>
      <text x="320" y="0" fill="#94A3B8">&#8594; localhost:27017 (Database: nexus [CONNECTED])</text>
    </g>

    <g class="log-line-3" transform="translate(0, 114)">
      <text x="0" y="0" fill="#10B981" font-weight="700">[✓] [2/5] ChromaDB Vector Store</text>
      <text x="320" y="0" fill="#94A3B8">&#8594; collection 'nexus_evidence' loaded (Cosine Sim: READY)</text>
    </g>

    <g class="log-line-4" transform="translate(0, 140)">
      <text x="0" y="0" fill="#10B981" font-weight="700">[✓] [3/5] Local Ollama LLM</text>
      <text x="320" y="0" fill="#94A3B8">&#8594; qwen2.5:7b active on port 11434 (Deterministic RAG)</text>
    </g>

    <g class="log-line-5" transform="translate(0, 166)">
      <text x="0" y="0" fill="#10B981" font-weight="700">[✓] [4/5] FastAPI Intelligence Core</text>
      <text x="320" y="0" fill="#38BDF8">&#8594; http://localhost:8000 (Docs: /docs [OPERATIONAL])</text>
    </g>

    <g class="log-line-6" transform="translate(0, 192)">
      <text x="0" y="0" fill="#10B981" font-weight="700">[✓] [5/5] Next.js 15 Web Console</text>
      <text x="320" y="0" fill="#38BDF8">&#8594; http://localhost:3000 (Three.js WebGL &#8226; 60 FPS)</text>
    </g>

    <!-- Ready Prompt -->
    <g class="log-line-6" transform="translate(0, 236)">
      <text x="0" y="0" fill="#10B981" font-weight="800">&gt;&gt;&gt; NEXUS INTELLIGENCE SUITE READY. MONITORING ACTIVE INVESTIGATIONS...</text>
      <rect x="735" y="-12" width="9" height="15" fill="#38BDF8" class="term-cursor" />
    </g>
  </g>
</svg>
