<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="100%" stop-color="#0A1124" />
    </linearGradient>

    <!-- Node Gradient 1: Ingestion -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Keyframe Animations -->
    <style>
      @keyframes flowDash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes pulseStep {
        0%, 100% { opacity: 0.88; }
        50% { opacity: 1; filter: drop-shadow(0 0 10px #38BDF8); }
      }
      @keyframes glowLight {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #38BDF8); }
      }

      .pulse-line {
        stroke-dasharray: 6, 8;
        animation: flowDash 1.2s linear infinite;
      }
      .step-1 { animation: pulseStep 4s ease-in-out infinite 0s; }
      .step-2 { animation: pulseStep 4s ease-in-out infinite 0.7s; }
      .step-3 { animation: pulseStep 4s ease-in-out infinite 1.4s; }
      .step-4 { animation: pulseStep 4s ease-in-out infinite 2.1s; }
      .step-5 { animation: pulseStep 4s ease-in-out infinite 2.8s; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1100" height="280" rx="14" fill="url(#pipeBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subtitle Header inside SVG -->
  <g transform="translate(550, 36)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle" fill="#38BDF8">
      AUTONOMOUS INVESTIGATIVE INTELLIGENCE PIPELINE
    </text>
  </g>

  <!-- Connecting Stream Lines (Behind Cards) -->
  <g stroke="#1E293B" stroke-width="3">
    <line x1="180" y1="140" x2="260" y2="140" />
    <line x1="390" y1="140" x2="470" y2="140" />
    <line x1="600" y1="140" x2="680" y2="140" />
    <line x1="810" y1="140" x2="890" y2="140" />
  </g>

  <!-- Animated Glowing Stream Particles -->
  <g stroke-width="3.5">
    <line x1="180" y1="140" x2="260" y2="140" stroke="#38BDF8" class="pulse-line" filter="url(#glowCyan)" />
    <line x1="390" y1="140" x2="470" y2="140" stroke="#818CF8" class="pulse-line" filter="url(#glowCyan)" />
    <line x1="600" y1="140" x2="680" y2="140" stroke="#C084FC" class="pulse-line" filter="url(#glowPurple)" />
    <line x1="810" y1="140" x2="890" y2="140" stroke="#34D399" class="pulse-line" filter="url(#glowCyan)" />
  </g>

  <!-- ================= PIPELINE STAGES ================= -->

  <!-- STEP 1: Evidence Ingestion -->
  <g class="step-1" transform="translate(60, 70)">
    <rect width="130" height="140" rx="10" fill="#0B1528" stroke="#0284C7" stroke-width="1.5" />
    <!-- Icon Circle -->
    <circle cx="65" cy="40" r="20" fill="#0369A1" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.5" />
    <text x="65" y="46" font-family="'Segoe UI Emoji', sans-serif" font-size="18" text-anchor="middle">📂</text>
    <text x="65" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">INGESTION</text>
    <text x="65" y="100" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">PDFs • Text • CDR</text>
    <text x="65" y="114" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Hawala • Ledgers</text>
    <rect x="25" y="125" width="80" height="4" rx="2" fill="#38BDF8" opacity="0.8" />
  </g>

  <!-- STEP 2: Extraction & Resolution -->
  <g class="step-2" transform="translate(270, 70)">
    <rect width="130" height="140" rx="10" fill="#131433" stroke="#6366F1" stroke-width="1.5" />
    <!-- Icon Circle -->
    <circle cx="65" cy="40" r="20" fill="#4338CA" fill-opacity="0.25" stroke="#818CF8" stroke-width="1.5" />
    <text x="65" y="46" font-family="'Segoe UI Emoji', sans-serif" font-size="18" text-anchor="middle">⚡</text>
    <text x="65" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">RESOLUTION</text>
    <text x="65" y="100" font-family="'JetBrains Mono', monospace" font-size="9" fill="#A5B4FC" text-anchor="middle">Entity Deduplication</text>
    <text x="65" y="114" font-family="'JetBrains Mono', monospace" font-size="9" fill="#A5B4FC" text-anchor="middle">OCR + NLP Aliasing</text>
    <rect x="25" y="125" width="80" height="4" rx="2" fill="#818CF8" opacity="0.8" />
  </g>

  <!-- STEP 3: 3D Topological Graph -->
  <g class="step-3" transform="translate(480, 70)">
    <rect width="130" height="140" rx="10" fill="#1B1033" stroke="#A855F7" stroke-width="1.5" />
    <!-- Icon Circle -->
    <circle cx="65" cy="40" r="20" fill="#7E22CE" fill-opacity="0.25" stroke="#C084FC" stroke-width="1.5" />
    <text x="65" y="46" font-family="'Segoe UI Emoji', sans-serif" font-size="18" text-anchor="middle">🕸️</text>
    <text x="65" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">3D TOPOLOGY</text>
    <text x="65" y="100" font-family="'JetBrains Mono', monospace" font-size="9" fill="#D8B4FE" text-anchor="middle">Force-Directed 3D</text>
    <text x="65" y="114" font-family="'JetBrains Mono', monospace" font-size="9" fill="#D8B4FE" text-anchor="middle">Centrality &amp; Shortest</text>
    <rect x="25" y="125" width="80" height="4" rx="2" fill="#C084FC" opacity="0.8" />
  </g>

  <!-- STEP 4: Spatial & Chrono Fusion -->
  <g class="step-4" transform="translate(690, 70)">
    <rect width="130" height="140" rx="10" fill="#0C1F24" stroke="#0D9488" stroke-width="1.5" />
    <!-- Icon Circle -->
    <circle cx="65" cy="40" r="20" fill="#0F766E" fill-opacity="0.25" stroke="#2DD4BF" stroke-width="1.5" />
    <text x="65" y="46" font-family="'Segoe UI Emoji', sans-serif" font-size="18" text-anchor="middle">🗺️</text>
    <text x="65" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">GEO &amp; TIMELINE</text>
    <text x="65" y="100" font-family="'JetBrains Mono', monospace" font-size="9" fill="#5EEAD4" text-anchor="middle">GIS Cluster Analysis</text>
    <text x="65" y="114" font-family="'JetBrains Mono', monospace" font-size="9" fill="#5EEAD4" text-anchor="middle">Chronological Sync</text>
    <rect x="25" y="125" width="80" height="4" rx="2" fill="#2DD4BF" opacity="0.8" />
  </g>

  <!-- STEP 5: AI Dossier & Court Reports -->
  <g class="step-5" transform="translate(900, 70)">
    <rect width="140" height="140" rx="10" fill="#092019" stroke="#10B981" stroke-width="1.5" />
    <!-- Icon Circle -->
    <circle cx="70" cy="40" r="20" fill="#047857" fill-opacity="0.25" stroke="#34D399" stroke-width="1.5" />
    <text x="70" y="46" font-family="'Segoe UI Emoji', sans-serif" font-size="18" text-anchor="middle">⚖️</text>
    <text x="70" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">AI DOSSIER</text>
    <text x="70" y="100" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6EE7B7" text-anchor="middle">Grounded LLM Chat</text>
    <text x="70" y="114" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6EE7B7" text-anchor="middle">Court-Ready PDF Pack</text>
    <rect x="30" y="125" width="80" height="4" rx="2" fill="#34D399" opacity="0.8" />
  </g>

  <!-- Bottom Mini Footer -->
  <g transform="translate(550, 250)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B" text-anchor="middle">
      ZERO DATA LEAKAGE • DETERMINISTIC EVIDENCE CHAIN • 100% AIR-GAPPED READY
    </text>
  </g>
</svg>
